<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snooze</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700;800&amp;family=Schibsted+Grotesk:wght@400;500;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#1B2420}a:hover{color:#000}
a:focus-visible,button:focus-visible,label:focus-within{outline:3px solid #2F6BD8;outline-offset:2px}

@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: {{panel}}; color: #EEF2EA; font-family: 'Schibsted Grotesk', 'Helvetica Neue', sans-serif; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; padding-top: 40px">

<div aria-hidden="true" style="padding: 12px 24px 0; display: flex; flex-direction: column; gap: 18px; opacity: .45">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 24px 0; font-size: 14px; color: #A9BBB1"><span style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="display: block; flex-shrink: 0; width: 10px; height: 10px; border-radius: 50%; background: {{lamp}}; box-shadow: 0 0 0 4px color-mix(in oklab, {{lamp}} 28%, transparent)"></span><span>Call2Remind</span></span><span>Thu, 2 Oct</span></div>
  <div style="padding-top: 28px"><div style="display: flex; align-items: baseline; gap: 8px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; font-weight: 900; color: {{lamp}}; line-height: 1"><span style="font-size: 56px; letter-spacing: 0.02em">9:30</span><span style="font-size: 23px">AM</span></div></div>
  <div style="font-size: 34px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; color: #EEF2EA">Standup — Intract eng</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; background: #F7F8F4; color: #1B2420; border-radius: 28px 28px 0 0; padding: 12px 24px 40px; display: flex; flex-direction: column; gap: 18px" role="dialog" aria-label="Snooze">
  <span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #C9CFC5"></span>
  <h2 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Ring again in</h2>
  <fieldset style="border: 0; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <legend style="position: absolute; opacity: 0; width: 1px; height: 1px; overflow: hidden">Snooze length</legend>
    <label style="position: relative; display: flex; flex-direction: column; justify-content: center; gap: 2px; height: 76px; padding: 0 18px; border-radius: 18px; cursor: pointer; background: #ECEEE8; color: #1B2420"><input type="radio" name="snooze" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0"><span style="font-size: 20px; font-weight: 700; letter-spacing: -0.01em">5 min</span><span style="font-size: 14px; color: #4F5A54">9:35 AM</span></label>
    <label style="position: relative; display: flex; flex-direction: column; justify-content: center; gap: 2px; height: 76px; padding: 0 18px; border-radius: 18px; cursor: pointer; background: #1B2420; color: #F7F8F4"><input type="radio" name="snooze" checked style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0"><span style="font-size: 20px; font-weight: 700; letter-spacing: -0.01em">10 min</span><span style="font-size: 14px; color: rgba(247,248,244,.75)">9:40 AM</span></label>
    <label style="position: relative; display: flex; flex-direction: column; justify-content: center; gap: 2px; height: 76px; padding: 0 18px; border-radius: 18px; cursor: pointer; background: #ECEEE8; color: #1B2420"><input type="radio" name="snooze" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0"><span style="font-size: 20px; font-weight: 700; letter-spacing: -0.01em">15 min</span><span style="font-size: 14px; color: #4F5A54">9:45 AM</span></label>
    <label style="position: relative; display: flex; flex-direction: column; justify-content: center; gap: 2px; height: 76px; padding: 0 18px; border-radius: 18px; cursor: pointer; background: #ECEEE8; color: #1B2420"><input type="radio" name="snooze" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0"><span style="font-size: 20px; font-weight: 700; letter-spacing: -0.01em">Custom</span><span style="font-size: 14px; color: #4F5A54">Pick a time</span></label>
  </fieldset>
  <div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: #ECEEE8">
    <div style="display: flex; gap: 8px" aria-hidden="true"><span aria-hidden="true" style="display: block; flex-shrink: 0; width: 14px; height: 14px; border-radius: 50%; box-sizing: border-box; border: 2px solid #4F5A54"></span><span aria-hidden="true" style="display: block; flex-shrink: 0; width: 14px; height: 14px; border-radius: 50%; background: {{lamp}}"></span><span aria-hidden="true" style="display: block; flex-shrink: 0; width: 14px; height: 14px; border-radius: 50%; background: {{lamp}}"></span></div>
    <div style="font-size: 14px; line-height: 1.4"><strong style="font-weight: 700">2 of 3 ring-backs left.</strong> <span style="color: #4F5A54">After the last one it moves to Missed.</span></div>
  </div>
  <a href="Home.dc.html" style="border: 0; margin: 0; font: inherit; cursor: pointer; text-decoration: none; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; background: #1B2420; color: #F7F8F4; height: 60px; width: 100%; min-height: 44px; padding: 0 20px; border-radius: 999px; font-size: 16px; font-weight: 600; letter-spacing: 0.005em"><span>Snooze 10 min</span></a>
  <a href="IncomingCall.dc.html" style="border: 0; margin: 0; font: inherit; cursor: pointer; text-decoration: none; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; background: transparent; color: #1B2420; height: 48px; width: 100%; min-height: 44px; padding: 0 20px; border-radius: 999px; font-size: 16px; font-weight: 600; letter-spacing: 0.005em"><span>Back to call</span></a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lamp": {"editor": "color", "default": "#F2A900", "options": ["#F2A900", "#FF7A45", "#8FD3B6"]}, "panel": {"editor": "color", "default": "#1F3B31", "options": ["#1F3B31", "#243447", "#3B2A22"]}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    return { lamp: this.props.lamp ?? '#F2A900', panel: this.props.panel ?? '#1F3B31' };
  }
}
</script>
</body>
</html>

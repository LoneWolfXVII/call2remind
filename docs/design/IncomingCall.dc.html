<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Incoming call</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700;800&amp;family=Schibsted+Grotesk:wght@400;500;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#1B2420}a:hover{color:#000}
a:focus-visible,button:focus-visible,label:focus-within{outline:3px solid #2F6BD8;outline-offset:2px}

@keyframes ring{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.9);opacity:0}}
@keyframes wave{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}

@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: {{panel}}; color: #EEF2EA; font-family: 'Schibsted Grotesk', 'Helvetica Neue', sans-serif; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; padding-top: 40px">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 24px 0; font-size: 14px; color: #A9BBB1"><span style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="display: block; flex-shrink: 0; width: 10px; height: 10px; border-radius: 50%; background: {{lamp}}; box-shadow: 0 0 0 4px color-mix(in oklab, {{lamp}} 28%, transparent)"></span><span>Call2Remind</span></span><span>Thu, 2 Oct</span></div>
<div style="padding: 56px 24px 0; display: flex; flex-direction: column; gap: 22px">
  <div style="align-self: flex-start; border-radius: 16px; padding: 16px 18px 14px; background: rgba(0,0,0,.22); box-shadow: inset 0 0 0 1px rgba(238,242,234,.14)">
    <div style="display: flex; align-items: baseline; gap: 8px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; font-weight: 900; color: {{lamp}}; line-height: 1"><span style="font-size: 64px; letter-spacing: 0.02em">9:30</span><span style="font-size: 26px">AM</span></div>
  </div>
  <h1 style="margin: 0; font-size: 40px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.04; color: #EEF2EA; text-wrap: balance">Standup — Intract eng</h1>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="display: flex; align-items: center; gap: 6px; font-size: 16px; color: #EEF2EA; line-height: 1.3"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; display: block"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Google Calendar, Work</span></span>
    <span style="font-size: 16px; color: #A9BBB1">9:30 – 9:45 AM, starts now</span>
  </div>
</div>
<div style="margin-top: auto; padding: 0 24px 44px; display: flex; flex-direction: column; gap: 20px">
  <a href="Answered.dc.html" aria-label="Answer: slide the plug into the socket" style="position: relative; display: flex; align-items: center; height: 80px; border-radius: 40px; box-shadow: inset 0 0 0 1.5px rgba(238,242,234,.3); padding: 0 8px; text-decoration: none; color: #A9BBB1">
    <span style="position: relative; width: 64px; height: 64px; flex-shrink: 0">
      <span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 50%; background: {{lamp}}; animation: ring 1.6s ease-out infinite"></span>
      <span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 50%; background: {{lamp}}; animation: ring 1.6s ease-out .8s infinite"></span>
      <span style="position: absolute; inset: 0; border-radius: 50%; background: {{lamp}}; color: #1B2420; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; display: block"><path d="M5.5 3.5h3.2l1.8 4.6-2.3 1.4a11 11 0 0 0 6.3 6.3l1.4-2.3 4.6 1.8v3.2a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 3.5 5.7a2 2 0 0 1 2-2.2z"/></svg></span>
    </span>
    <span style="flex-grow: 1; text-align: center; font-size: 16px; font-weight: 600; color: #EEF2EA">Slide to answer</span>
    <span style="width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; margin-right: 4px"><span aria-hidden="true" style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%; box-sizing: border-box; border: 2px solid #A9BBB1; display: flex; align-items: center; justify-content: center"><span style="width: 11px; height: 11px; border-radius: 50%; background: #A9BBB1"></span></span></span>
  </a>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
    <a href="Snooze.dc.html" style="border: 0; margin: 0; font: inherit; cursor: pointer; text-decoration: none; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; background: transparent; color: #EEF2EA; box-shadow: inset 0 0 0 1.5px rgba(238,242,234,.45); height: 56px; width: 100%; min-height: 44px; padding: 0 20px; border-radius: 999px; font-size: 16px; font-weight: 600; letter-spacing: 0.005em"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; display: block"><circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.5 1.6M5 3.8 2.6 6.2M19 3.8l2.4 2.4"/></svg><span>Snooze 5 min</span></a>
    <span style="font-size: 14px; color: #A9BBB1">Hold for 10 min or a custom time</span>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lamp": {"editor": "color", "default": "#F2A900", "options": ["#F2A900", "#FF7A45", "#8FD3B6"]}, "panel": {"editor": "color", "default": "#1F3B31", "options": ["#1F3B31", "#243447", "#3B2A22"]}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    return { lamp: this.props.lamp ?? '#F2A900', panel: this.props.panel ?? '#1F3B31' };
  }
}
</script>
</body>
</html>

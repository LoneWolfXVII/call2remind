<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #ECEEE8; color: #1B2420; font-family: 'Schibsted Grotesk', 'Helvetica Neue', sans-serif; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; padding-top: 40px">

<div style="display: flex; align-items: center; gap: 4px; height: 64px; padding: 0 8px 0 4px; flex-shrink: 0"><a href="Home.dc.html" aria-label="Discard" style="border: 0; margin: 0; font: inherit; cursor: pointer; text-decoration: none; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; width: 48px; height: 48px; border-radius: 50%; background: transparent; color: #1B2420"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; display: block"><path d="M6 6l12 12M18 6 6 18"/></svg></a><h1 style="font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0; color: #1B2420; line-height: 1.2; flex-grow: 1">New habit</h1><a href="Home.dc.html" style="border: 0; margin: 0; font: inherit; cursor: pointer; text-decoration: none; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; background: #1B2420; color: #F7F8F4; height: 44px; width: auto; min-height: 44px; padding: 0 20px; border-radius: 999px; font-size: 16px; font-weight: 600; letter-spacing: 0.005em; padding: 0 22px; font-size: 15px"><span>Save</span></a></div>
<div style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 24px">
  <div style="display: flex; flex-direction: column; gap: 10px">

    <div style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" style="border: 0; margin: 0; font: inherit; cursor: pointer; text-decoration: none; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; background: #1B2420; color: #F7F8F4; height: 40px; min-height: 40px; padding: 0 16px; border-radius: 10px; font-size: 15px; font-weight: 600">Medicine</button><button type="button" style="border: 0; margin: 0; font: inherit; cursor: pointer; text-decoration: none; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; background: #F7F8F4; color: #1B2420; box-shadow: inset 0 0 0 1px #C9CFC5; height: 40px; min-height: 40px; padding: 0 16px; border-radius: 10px; font-size: 15px; font-weight: 600">Gym</button><button type="button" style="border: 0; margin: 0; font: inherit; cursor: pointer; text-decoration: none; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; background: #F7F8F4; color: #1B2420; box-shadow: inset 0 0 0 1px #C9CFC5; height: 40px; min-height: 40px; padding: 0 16px; border-radius: 10px; font-size: 15px; font-weight: 600">Water</button><button type="button" style="border: 0; margin: 0; font: inherit; cursor: pointer; text-decoration: none; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; background: #F7F8F4; color: #1B2420; box-shadow: inset 0 0 0 1px #C9CFC5; height: 40px; min-height: 40px; padding: 0 16px; border-radius: 10px; font-size: 15px; font-weight: 600">Standup</button></div>
  </div>

    <span style="font-size: 13px; font-weight: 600; color: #4F5A54">What should it say?</span>

  </label>
  <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">

    <div style="display: flex; justify-content: space-between"><label aria-label="Monday" style="position: relative; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; cursor: pointer; background: #1B2420; color: #F7F8F4"><input type="checkbox" checked style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">M</label><label aria-label="Tuesday" style="position: relative; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; cursor: pointer; background: #1B2420; color: #F7F8F4"><input type="checkbox" checked style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">T</label><label aria-label="Wednesday" style="position: relative; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; cursor: pointer; background: #1B2420; color: #F7F8F4"><input type="checkbox" checked style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">W</label><label aria-label="Thursday" style="position: relative; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; cursor: pointer; background: #1B2420; color: #F7F8F4"><input type="checkbox" checked style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">T</label><label aria-label="Friday" style="position: relative; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; cursor: pointer; background: #1B2420; color: #F7F8F4"><input type="checkbox" checked style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">F</label><label aria-label="Saturday" style="position: relative; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; cursor: pointer; background: transparent; color: #1B2420; box-shadow: inset 0 0 0 1.5px #1B2420"><input type="checkbox" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">S</label><label aria-label="Sunday" style="position: relative; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; cursor: pointer; background: transparent; color: #1B2420; box-shadow: inset 0 0 0 1.5px #1B2420"><input type="checkbox" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">S</label></div>

  <div style="display: flex; flex-direction: column; gap: 10px">

    <div style="display: flex; gap: 8px; align-items: center">
      <button type="button" style="border: 0; margin: 0; font: inherit; cursor: pointer; text-decoration: none; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 16px; border-radius: 12px; background: {{panel}}; color: {{lamp}}; font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; font-weight: 900; font-size: 22px">10:00 AM</button>
      <button type="button" style="border: 0; margin: 0; font: inherit; cursor: pointer; text-decoration: none; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 14px; border-radius: 12px; background: transparent; color: #1B2420; box-shadow: inset 0 0 0 1.5px #C9CFC5; font-size: 15px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; display: block"><path d="M12 5v14M5 12h14"/></svg>Add a time</button>
    </div>
  </div>
  <div style="background: #F7F8F4; border-radius: 20px; padding: 0 16px">
    <a href="Ringtone.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 64px; text-decoration: none; color: #1B2420; border-bottom: 1px solid #C9CFC5"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; display: block"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg><span style="flex-grow: 1"><span style="display: block; font-size: 16px; font-weight: 500">Ringtone</span><span style="display: block; font-size: 14px; color: #4F5A54">Switchboard (default)</span></span><span style="color: #4F5A54"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; display: block"><path d="M9.5 6l6 6-6 6"/></svg></span></a>
    <div style="border-bottom: 1px solid #C9CFC5"><label style="display: flex; align-items: center; gap: 16px; padding: 14px 0; min-height: 48px; cursor: pointer; position: relative"><span style="flex-grow: 1; min-width: 0"><span style="display: block; font-size: 16px; font-weight: 500; color: #1B2420; line-height: 1.35">Read it aloud when I answer</span><span style="display: block; font-size: 14px; color: #4F5A54; line-height: 1.4; margin-top: 2px">&quot;It's 10 AM. Take vitamin D.&quot;</span></span><input type="checkbox" role="switch" checked style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0"><span aria-hidden="true" style="flex-shrink: 0; position: relative; width: 52px; height: 32px; border-radius: 16px; background: #1B2420"><span style="position: absolute; border-radius: 50%; left: 22px; width: 22px; height: 22px; top: 5px; background: {{lamp}}"></span></span></label></div>
    <label style="display: flex; align-items: center; gap: 16px; padding: 14px 0; min-height: 48px; cursor: pointer; position: relative"><span style="flex-grow: 1; min-width: 0"><span style="display: block; font-size: 16px; font-weight: 500; color: #1B2420; line-height: 1.35">Keep ringing back if I miss it</span><span style="display: block; font-size: 14px; color: #4F5A54; line-height: 1.4; margin-top: 2px">Up to 3 times, 5 min apart</span></span><input type="checkbox" role="switch" checked style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0"><span aria-hidden="true" style="flex-shrink: 0; position: relative; width: 52px; height: 32px; border-radius: 16px; background: #1B2420"><span style="position: absolute; border-radius: 50%; left: 22px; width: 22px; height: 22px; top: 5px; background: {{lamp}}"></span></span></label>
  </div>
</div>
</div>

<script type="text/x-dc" data-dc-script data-props='{"lamp": {"editor": "color", "default": "#F2A900", "options": ["#F2A900", "#FF7A45", "#8FD3B6"]}, "panel": {"editor": "color", "default": "#1F3B31", "options": ["#1F3B31", "#243447", "#3B2A22"]}, "$preview": {"width": 390, "height": 844}}'>
